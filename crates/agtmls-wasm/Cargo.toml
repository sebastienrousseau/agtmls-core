[package]
name = "agtmls-wasm"
description = "WebAssembly bindings for the AgtMLS engine: audit agent skills in a browser, with nothing leaving the page"
keywords = ["wasm", "agent", "skills", "security", "audit"]
categories = ["wasm", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
agtmls-core = { path = "../agtmls-core", version = "=0.0.1", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

[lints]
workspace = true
