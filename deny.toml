[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
# Permissive only. A copyleft dependency would change the terms under which
# this crate can be embedded in the WASM, Python and Node builds.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The dependency list is short on purpose: this crate parses untrusted input,
# and every crate added is attack surface inherited. Adding one requires an ADR.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
